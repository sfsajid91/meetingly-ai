[package]
name = "meetingly-byok"
version = "1.3.1"
description = "Local-first meeting assistant"
authors = ["Meetingly"]
license = "Apache-2.0"
repository = "https://github.com/iskandaryv/meetingly-ai"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "meetingly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.6", features = [] }
cpal = "0.16"
hound = "3.5"
nnnoiseless = { version = "0.5", default-features = false }
