[package]
name = "meetingly-byok"
version = "1.3.1"
description = "Local-first meeting assistant"
authors = ["Meetingly"]
license = "Apache-2.0"
repository = "https://github.com/iskandaryv/meetingly-ai"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "meetingly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.6", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4"
cpal = "0.16"
hound = "3.5"
nnnoiseless = { version = "0.5", default-features = false }
# Default "v1" feature: Secret Service (zbus) on Linux, Keychain on macOS, Credential Manager on Windows; no plaintext fallback.
keyring = "4.2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
url = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
dirs = "6"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", features = ["screenshot"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = "0.9"
